[package]
name = "q-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "q-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-stream = "0.3"
axum = "0.8"
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
