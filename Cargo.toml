[workspace]
resolver = "2"
members = [
    "crates/q-core",
    "crates/q-application",
    "crates/q-providers",
    "crates/q-server",
    "crates/q-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

q-core = { path = "crates/q-core" }
q-application = { path = "crates/q-application" }
q-providers = { path = "crates/q-providers" }
q-server = { path = "crates/q-server" }
