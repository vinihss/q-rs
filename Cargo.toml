[workspace]
resolver = "2"
members = [
  "crates/q-core",
  "crates/q-application",
  "crates/q-providers",
  "crates/q-server",
  "crates/q-cli",
  "crates/q-tools",
  "crates/q-skills",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

q-core = { path = "crates/q-core" }
q-application = { path = "crates/q-application" }
q-providers = { path = "crates/q-providers" }
q-server = { path = "crates/q-server" }
q-tools = { path = "crates/q-tools" }
q-skills = { path = "crates/q-skills" }
